name: Update feeds

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches: [main]
    paths: ["sources.json", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python scripts/fetch_feeds.py
      - name: Commit feeds.json
        run: |
          git config user.name "aerointel-bot"
          git config user.email "aerointel-bot@users.noreply.github.com"
          git add feeds.json
          git diff --staged --quiet || git commit -m "Update feeds"
          git push
